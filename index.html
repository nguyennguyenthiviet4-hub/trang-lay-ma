
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIEN CUONG - FF KEY</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;padding:20px;font-family:Arial,sans-serif;
  color:white;background:radial-gradient(circle at top,#103e69,#030711 70%);
}
.card{
  width:100%;max-width:390px;padding:28px 22px;text-align:center;
  background:#071321;border:1px solid #00d9ff;border-radius:20px;
  box-shadow:0 0 25px #00d9ff40;
}
.logo{font-size:30px;font-weight:900;color:#00e5ff}
.sub{font-size:12px;letter-spacing:3px;color:#9bbdd5;margin-top:8px}
h2{margin-top:30px}
p{color:#bfd0df;font-size:14px;line-height:1.7}
button{
  width:100%;padding:15px;margin-top:13px;border-radius:9px;
  font-weight:bold;font-size:15px;cursor:pointer;
}
.main{background:#00d9ff;color:#00121c;border:0}
.alt{background:#102b40;color:white;border:1px solid #285a76}
#status{margin-top:18px;font-size:13px;color:#00e5ff;line-height:1.6}
footer{margin-top:25px;color:#6e8ca5;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">TIEN CUONG</div>
  <div class="sub">FREE FIRE KEY SYSTEM</div>

  <h2>NHẬN KEY MIỄN PHÍ</h2>
  <p>
    Bấm nút bên dưới để truy cập Link4M.
    Sau khi hoàn thành các bước, hãy quay lại trang này.
  </p>

  <button class="main" onclick="getKey()">LẤY KEY</button>
  <button class="alt" onclick="checkKey()">KIỂM TRA KEY</button>

  <div id="status">Trạng thái: Chưa xác minh</div>
  <footer>TIEN CUONG • FREE FIRE</footer>
</div>

<script>
const LINK4M = "https://link4m.org/JUOH7z";

function getKey(){
  window.location.href = LINK4M;
}

function checkKey(){
  document.getElementById("status").textContent =
    "Link4M đã được gắn. Chưa thể xác minh hoàn thành hoặc cấp key tự động.";
}
</script>
</body>
</html>
